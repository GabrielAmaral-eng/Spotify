<div class="playlists-panel" [class.open]="open">
  <div class="panel-header">
    <span class="panel-title">Playlists</span>
  </div>
  <div class="panel-divider"></div>
  <div class="panel-list">
    <!-- Action button to create playlist -->
    <div class="playlist-item create-btn" (click)="onCreatePlaylist()">
      <div class="create-icon-wrapper">
        <ion-icon name="add-outline" class="create-icon"></ion-icon>
      </div>
      <div class="playlist-info">
        <span class="playlist-name create-text">Criar nova playlist</span>
      </div>
    </div>
    
    <div class="panel-divider inner-divider" *ngIf="(playlists$ | async)?.length"></div>

    <div class="playlist-item" *ngFor="let pl of playlists$ | async" (click)="onPlaylistClick(pl)">
      <img src="assets/icon/Folder.svg" alt="Playlist folder" class="playlist-icon">
      <div class="playlist-info">
        <span class="playlist-name">{{ pl.name }}</span>
        <span class="playlist-count">{{ pl.tracks.length || 0 }} músicas</span>
      </div>
      <button class="playlist-options-btn" aria-label="Opções da playlist" (click)="onPlaylistOptions($event, pl)">
        <ion-icon name="ellipsis-vertical" class="options-icon"></ion-icon>
      </button>
    </div>

    <!-- Empty state if there are no playlists -->
    <div class="empty-state" *ngIf="!(playlists$ | async)?.length">
      <span class="empty-text">Nenhuma playlist criada.</span>
    </div>
  </div>
</div>

<!-- Pop-up "Criar nova playlist" (elemento HTML próprio) -->
<div class="create-overlay" *ngIf="showCreatePopup" (click)="cancelCreatePlaylist()">
  <div class="create-card" (click)="$event.stopPropagation()">
    <h2 class="create-title">Nova playlist</h2>

    <form class="create-form" (ngSubmit)="confirmCreatePlaylist()">
      <input
        class="create-input"
        type="text"
        placeholder="Nome da playlist"
        name="newPlaylistName"
        [(ngModel)]="newPlaylistName"
      />

      <textarea
        class="create-input create-textarea"
        placeholder="Descrição opcional"
        name="newPlaylistDescription"
        [(ngModel)]="newPlaylistDescription"
      ></textarea>

      <div class="create-actions">
        <button type="submit" class="create-btn-action create-btn-confirm">Criar</button>
        <button type="button" class="create-btn-action create-btn-cancel" (click)="cancelCreatePlaylist()">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</div>
