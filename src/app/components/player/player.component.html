<div class="player-host">
  <ng-container *ngIf="currentTrack$ | async as track; else emptyPlayer">
    <section class="player-shell" *ngIf="{ value: progress$ | async } as progressState">
      <ion-button class="edge-button edge-button--left" fill="clear" routerLink="/search" aria-label="Voltar">
        <ion-icon name="chevron-back" aria-hidden="true"></ion-icon>
      </ion-button>

      <ion-button class="edge-button edge-button--right" fill="clear" routerLink="/search" aria-label="Voltar para busca">
        <ion-icon name="chevron-forward" aria-hidden="true"></ion-icon>
      </ion-button>

      <div class="player-panel">
        <div class="player-actions" *ngIf="favoriteIds$ | async as favoriteIds">
          <ion-button class="skip-button" fill="clear" type="button" aria-label="Faixa anterior" disabled>
            <ion-icon name="play-skip-back" aria-hidden="true"></ion-icon>
          </ion-button>

          <ion-button class="play-button" fill="clear" type="button" aria-label="Alternar reproducao" (click)="toggle()">
            <ion-icon [name]="(isPlaying$ | async) ? 'pause' : 'play'" aria-hidden="true"></ion-icon>
          </ion-button>

          <ion-button class="skip-button" fill="clear" type="button" aria-label="Proxima faixa" disabled>
            <ion-icon name="play-skip-forward" aria-hidden="true"></ion-icon>
          </ion-button>

          <ion-button
            class="utility-button utility-button--favorite"
            fill="clear"
            type="button"
            [attr.aria-label]="favoriteIds.has(track.id) ? 'Remover dos favoritos' : 'Favoritar'"
            (click)="toggleFavorite(track)"
          >
            <ion-icon [name]="favoriteIds.has(track.id) ? 'heart' : 'heart-outline'" aria-hidden="true"></ion-icon>
          </ion-button>

          <ion-button
            class="utility-button utility-button--playlist"
            fill="clear"
            type="button"
            aria-label="Adicionar a playlist"
            (click)="addToPlaylist(track)"
          >
            <ion-icon name="add-circle-outline" aria-hidden="true"></ion-icon>
          </ion-button>
        </div>

        <div class="player-progress">
          <span>{{ progressToSeconds(progressState.value, track.duration) | duration }}</span>
          <ion-range
            min="0"
            max="100"
            [value]="progressState.value ?? 0"
            aria-label="Progresso"
            (ionChange)="seek($event)"
          ></ion-range>
          <span>{{ track.duration | duration }}</span>
        </div>

        <div class="player-meta">
          <h1>{{ track.title }}</h1>
          <p>{{ track.artist }}</p>
          <span>{{ track.album }}</span>
        </div>
      </div>
    </section>
  </ng-container>

  <ng-template #emptyPlayer>
    <div class="empty-player">
      <ion-button class="edge-button edge-button--left" fill="clear" routerLink="/search" aria-label="Voltar">
        <ion-icon name="chevron-back" aria-hidden="true"></ion-icon>
      </ion-button>
      <ion-icon name="radio-outline" aria-hidden="true"></ion-icon>
      <h1>Nenhuma musica tocando</h1>
      <ion-button routerLink="/search">Buscar musicas</ion-button>
    </div>
  </ng-template>
</div>
