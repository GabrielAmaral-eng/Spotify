<ion-item class="track-item" lines="none">
  <button
    class="track-item__main"
    type="button"
    (click)="onPlay()"
    aria-label="Reproduzir musica"
  >
    <ion-thumbnail>
      <img *ngIf="track.thumbnail; else noCover" [src]="track.thumbnail" [alt]="track.album" />
      <ng-template #noCover>
        <div class="track-item__cover-fallback">
          <ion-icon name="musical-notes-outline" aria-hidden="true"></ion-icon>
        </div>
      </ng-template>
    </ion-thumbnail>

    <ion-label>
      <h3>{{ track.title }}</h3>
      <p>{{ track.artist }}</p>
      <span>{{ track.duration | duration }}</span>
    </ion-label>
  </button>

  <div class="track-item__actions" slot="end" *ngIf="showActions">
    <ion-button
      fill="clear"
      size="small"
      type="button"
      [attr.aria-label]="favorite ? 'Remover dos favoritos' : 'Adicionar aos favoritos'"
      (click)="onFavorite($event)"
    >
      <ion-icon [name]="favorite ? 'heart' : 'heart-outline'" aria-hidden="true"></ion-icon>
    </ion-button>
    <ion-button
      fill="clear"
      size="small"
      type="button"
      aria-label="Adicionar a playlist"
      (click)="onAdd($event)"
    >
      <ion-icon name="add-circle-outline" aria-hidden="true"></ion-icon>
    </ion-button>
  </div>

  <ion-button
    *ngIf="removable"
    fill="clear"
    size="small"
    type="button"
    slot="end"
    aria-label="Remover"
    (click)="onRemove($event)"
  >
    <ion-icon name="trash-outline" aria-hidden="true"></ion-icon>
  </ion-button>
</ion-item>
