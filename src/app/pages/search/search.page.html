<ion-content class="ion-padding">
  <!-- Top Bar with Logo, Search Bar, and Library Button -->
  <div class="search-top-bar">
    <!-- Logo and Melodix Text -->
    <div class="logo-section">
      <img src="assets/icon/Melodix_Logo.svg" alt="Melodix" class="logo-icon" />
      <span class="melodix-text">Melodix</span>
    </div>

    <!-- Search Bar -->
    <ion-searchbar
      class="search-bar"
      mode="ios"
      placeholder="Buscar música, artista ou álbum"
      [value]="query"
      debounce="0"
      (ionInput)="onSearch($event)"
    ></ion-searchbar>

    <!-- Library Button — toggle do painel de playlists -->
    <ion-button
      class="library-btn"
      [class.active]="showPlaylists"
      aria-label="Abrir biblioteca"
      (click)="togglePlaylists()"
    >
      <img src="assets/icon/Library.svg" alt="Library" class="library-icon" />
    </ion-button>
  </div>

  <!-- Painel de Playlists -->
  <app-playlists [open]="showPlaylists"></app-playlists>

  <ion-note color="danger" *ngIf="errorMessage">{{ errorMessage }}</ion-note>

  <div class="idle-area" *ngIf="!loading && !query">
    <div
      class="song-wheel"
      (wheel)="onWheel($event)"
      (pointerdown)="onWheelPointerDown($event)"
      (pointermove)="onWheelPointerMove($event)"
      (pointerup)="onWheelPointerEnd($event)"
      (pointercancel)="onWheelPointerEnd($event)"
      (mouseenter)="onWheelMouseEnter($event)"
      tabindex="0"
    >
      <div class="wheel-arc-circle"></div>
      <div
        *ngFor="let song of mockSongs; let i = index; trackBy: trackBySongId"
        class="wheel-item"
        [class.selected]="i === selectedSongIndex"
        [style.transform]="getItemTransform(getOffsetForSong(i))"
        [style.opacity]="getItemOpacity(getOffsetForSong(i))"
      >
        <div class="wheel-dot"></div>
        <div class="wheel-text">
          <div class="wheel-title">{{ song.title }}</div>
          <div class="wheel-artist">{{ song.artist }}</div>
        </div>
      </div>
    </div>

    <!-- Visualizador de áudio — só aparece quando há música tocando -->
    <app-audio-visualizer
      *ngIf="isPlaying$ | async"
      class="search-visualizer"
    ></app-audio-visualizer>
  </div>

  <ion-list *ngIf="loading">
    <ion-item lines="none" *ngFor="let skeleton of [1, 2, 3, 4]">
      <ion-thumbnail slot="start">
        <ion-skeleton-text animated></ion-skeleton-text>
      </ion-thumbnail>
      <ion-label>
        <h3><ion-skeleton-text animated style="width: 70%"></ion-skeleton-text></h3>
        <p><ion-skeleton-text animated style="width: 45%"></ion-skeleton-text></p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ng-container *ngIf="favoriteIds$ | async as favoriteIds">
    <app-track-item
      *ngFor="let track of results; trackBy: trackByTrackId"
      [track]="track"
      [favorite]="favoriteIds.has(track.id)"
      (playTrack)="play($event)"
      (toggleFavorite)="toggleFavorite($event)"
      (addToPlaylist)="addToPlaylist($event)"
    ></app-track-item>
  </ng-container>
</ion-content>
